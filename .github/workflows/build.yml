# GitHub Actions CI/CD Workflow for NewAPI Middleware Tool
# 构建并推送 All-in-One Docker 镜像 (Go 后端, 支持 amd64 和 arm64)
# 已修复：用 QEMU + buildx 跨架构构建（不需要私有 ARM runner），新增独立版本标签

name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/build.yml'
      - '!**/*.md'
      - '!**/.gitignore'
      - '!.env.example'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '!**/*.md'
  # 支持手动触发
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # ====== 你要的独立版本标签！不会覆盖旧镜像 ======
  FIX_VERSION_TAG: model-status-fix-20260814

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ====== 用 QEMU 模拟跨架构（替代原作者私有 ARM runner）======
      - name: Set up QEMU for multi-arch
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # ====== 打标签规则 ======
          tags: |
            # 你要的独立固定版本标签（方便回滚，最重要！）
            type=raw,value=${{ env.FIX_VERSION_TAG }}
            # SHA 短标签
            type=sha,prefix=
            # latest 标签（默认分支才打，如果你不想打 latest 就把下面两行删了）
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # ====== 同时构建 amd64 + arm64 ======
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect final image
        if: github.event_name != 'pull_request'
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.FIX_VERSION_TAG }}
